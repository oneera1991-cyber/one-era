<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONE ERA — CJ Adapter Test</title>

  <style>
    body {
      margin: 0;
      background: #e8dfd2;
      color: #11100f;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 24px 5%;
      border-bottom: 1px solid rgba(17,16,15,.15);
      font-family: Georgia, serif;
      font-size: 24px;
      letter-spacing: .12em;
    }

    main {
      max-width: 900px;
      margin: 70px auto;
      padding: 0 24px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .6;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(48px, 8vw, 88px);
      font-weight: normal;
      line-height: .95;
      margin: 15px 0 30px;
    }

    .notice {
      padding: 22px;
      background: #f2ebe1;
      border-left: 3px solid #c88f9d;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 18px;
      border: 0;
      background: #11100f;
      color: #fff;
      font-size: 13px;
      letter-spacing: .12em;
      cursor: pointer;
      margin-bottom: 30px;
    }

    button:hover {
      opacity: .9;
    }

    .panel {
      background: #f7f1e8;
      padding: 25px;
      margin-top: 20px;
    }

    .panel h2 {
      font-family: Georgia, serif;
      font-weight: normal;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #11100f;
      color: #e8dfd2;
      padding: 20px;
      overflow-x: auto;
      line-height: 1.5;
      font-size: 13px;
    }

    .success {
      color: #173c35;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .error {
      color: #9d302b;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<header>
  ONE ERA
</header>

<main>

  <div class="eyebrow">
    ONE ERA · PHASE 4.7
  </div>

  <h1>
    CJ Adapter<br>
    Test.
  </h1>

  <div class="notice">
    <strong>TEST MODE</strong><br>
    This page does not contact CJ, does not create a real CJ order,
    does not create a shipment, and does not charge money.
  </div>

  <button id="generateButton">
    GENERATE CJ TEST PAYLOAD
  </button>

  <div id="result"></div>

  <div class="panel">
    <h2>ONE ERA → CJ</h2>

    <pre id="payload">
No payload generated yet.
    </pre>
  </div>

</main>

<script>

  const result =
    document.getElementById("result");

  const payload =
    document.getElementById("payload");

  const button =
    document.getElementById("generateButton");


  function showError(message) {

    result.innerHTML =
      '<div class="error">✕ ' +
      message +
      '</div>';

  }


  function showSuccess(message) {

    result.innerHTML =
      '<div class="success">✓ ' +
      message +
      '</div>';

  }


  button.addEventListener(
    "click",
    function () {

      try {

        if (
          typeof window.ONEERA_CJ ===
          "undefined"
        ) {

          showError(
            "CJ Adapter could not be loaded."
          );

          return;

        }


        const data =
          window.ONEERA_CJ
            .generateTestPayload();


        payload.textContent =
          JSON.stringify(
            data,
            null,
            2
          );


        showSuccess(
          "CJ TEST PAYLOAD GENERATED"
        );


      } catch (error) {

        console.error(error);

        showError(
          error.message ||
          "Unable to generate CJ payload."
        );

      }

    }
  );

</script>


<script src="cj-adapter.js"></script>

</body>
</html>
