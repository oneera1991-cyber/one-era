<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Product — ONE ERA</title>

<link
  rel="stylesheet"
  href="styles.css"
>

<style>

.pd{
  padding:70px 0;
}

.pd-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
}

.pd-art{
  aspect-ratio:1/1;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(200,143,157,.65),
      transparent 14%
    ),
    linear-gradient(
      145deg,
      #d7c8bf,
      #1c2c28
    );

  display:flex;
  align-items:center;
  justify-content:center;

  color:#f5eee5;
  letter-spacing:.16em;
  font-size:11px;
  text-transform:uppercase;
}

.pd-art span{
  opacity:.7;
}

.pd-copy h1{
  font-size:clamp(42px,5vw,70px);
  margin:12px 0;
}

.pd-copy .price{
  font-size:18px;
  margin:20px 0;
}

.pd-copy p{
  line-height:1.8;
  color:#625b53;
}

.pd-meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line);
  margin-top:30px;
}

.pd-meta div{
  padding:14px 0;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.pd-meta b{
  display:block;
  font-size:8px;
  letter-spacing:.13em;
  text-transform:uppercase;
  opacity:.5;
  margin-bottom:4px;
}

.pd-tabs{
  margin-top:80px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.pd-tab{
  border-top:1px solid var(--line);
  padding:22px;
}

.pd-tab h3{
  font-size:27px;
}

.pd-tab p{
  font-size:13px;
  line-height:1.8;
  color:#665f57;
}

.notice{
  background:#f2eadf;
  padding:20px;
  font-size:12px;
  color:#665f57;
  margin-top:20px;
  line-height:1.7;
}

.test-badge{
  display:inline-block;
  padding:7px 11px;
  background:#ead8d2;
  color:#604c46;
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-bottom:15px;
}

.ritual-list{
  padding-left:18px;
  color:#665f57;
  font-size:13px;
  line-height:1.9;
}


/* ==============================
   COMMERCE
============================== */

.buy-area{
  margin-top:25px;
}

.add-to-bag{
  width:100%;
  border:0;
  padding:17px 20px;

  background:#11100f;
  color:#fff;

  cursor:pointer;

  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.add-to-bag:hover{
  opacity:.85;
}

.add-to-bag:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.add-success{
  display:none;

  margin-top:15px;

  padding:16px;

  background:#edf1eb;

  color:#315447;

  font-size:12px;

  line-height:1.7;
}

.add-success a{
  color:#315447;
}


@media(max-width:750px){

  .pd-grid,
  .pd-tabs{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header class="site-header">

  <div class="container nav">

    <a
      class="wordmark"
      href="index.html"
    >
      ONE ERA
    </a>


    <nav class="nav-links">

      <a href="discover.html">
        Explore
      </a>

      <a href="practice.html">
        Practice
      </a>

      <a
        class="active-nav"
        href="shop.html"
      >
        Shop
      </a>

      <a href="learn.html">
        Learn
      </a>

      <a href="journal.html">
        Journal
      </a>

      <a href="about.html">
        The Society
      </a>

    </nav>


    <div class="nav-icons">

      <span>⌕</span>

      <a href="cart.html">

        Bag
        <span data-cart-count>0</span>

      </a>

    </div>


    <span class="mobile-menu">
      ☰
    </span>

  </div>

</header>



<main>

<section class="pd">

<div
  class="container"
  id="productRoot"
>

  <p>
    Loading…
  </p>

</div>

</section>

</main>



<footer class="footer">

  <div class="container">

    <div class="wordmark">
      ONE ERA
    </div>

    <p>
      THE SPIRITUAL SOCIETY
    </p>

  </div>

</footer>



<script>


/*
==================================================
ONE ERA COMMERCE CORE
==================================================

Single Cart Storage:

oneEraCart

TEST MODE ONLY
==================================================
*/


const CART_KEY = "oneEraCart";


let currentProduct = null;


/* ==============================================
   GET CART
============================================== */

function getCart(){

  try{

    const stored =
      localStorage.getItem(
        CART_KEY
      );


    if(!stored){

      return [];

    }


    const cart =
      JSON.parse(stored);


    return Array.isArray(cart)
      ? cart
      : [];

  }

  catch(error){

    console.error(
      "Cart read error:",
      error
    );

    return [];

  }

}


/* ==============================================
   SAVE CART
============================================== */

function saveCart(cart){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* ==============================================
   BAG COUNT
============================================== */

function updateBagCount(){

  const cart =
    getCart();


  const count =
    cart.reduce(
      function(total,item){

        return total +
          Number(
            item.quantity || 0
          );

      },
      0
    );


  document
    .querySelectorAll(
      "[data-cart-count]"
    )
    .forEach(
      function(element){

        element.textContent =
          count;

      }
    );

}


/* ==============================================
   ADD TO BAG
============================================== */

function addToBag(){

  if(!currentProduct){

    alert(
      "Product is not ready yet."
    );

    return;

  }


  let cart =
    getCart();


  /*
    Check existing product
  */

  const existing =
    cart.find(
      function(item){

        return (
          item.productId ===
          currentProduct.id
        );

      }
    );


  if(existing){

    existing.quantity =
      Number(
        existing.quantity || 0
      ) + 1;

  }

  else{

    cart.push({

      productId:
        currentProduct.id,

      slug:
        currentProduct.slug,

      name:
        currentProduct.name,

      quantity:1,

      price:
        currentProduct.price || {
          amount:0,
          currency:"THB",
          display:"TEST PRICE"
        },

      supplier:
        currentProduct.supplier || null,

      testMode:true

    });

  }


  /*
    Save
  */

  saveCart(cart);


  /*
    Update header
  */

  updateBagCount();


  /*
    Success message
  */

  const success =
    document.getElementById(
      "addSuccess"
    );


  if(success){

    success.style.display =
      "block";

  }


  /*
    Button feedback
  */

  const button =
    document.getElementById(
      "addToBagButton"
    );


  if(button){

    button.textContent =
      "Added to bag ✓";

  }

}


/* ==============================================
   LOAD PRODUCT
============================================== */

async function loadProduct(){

  const root =
    document.getElementById(
      "productRoot"
    );


  try{

    /*
      Support:

      product.html?id=one-era-green-fluorite

      product.html?product=green-fluorite
    */

    const params =
      new URLSearchParams(
        location.search
      );


    const requestedId =
      params.get("id") ||
      params.get("product");


    /*
      Load product database
    */

    const response =
      await fetch(
        "products.json",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "products.json could not be loaded."
      );

    }


    const data =
      await response.json();


    /*
      Support:

      [...]

      OR

      {
        products:[]
      }
    */

    const products =
      Array.isArray(data)
        ? data
        : data.products;


    if(!Array.isArray(products)){

      throw new Error(
        "Invalid products.json structure."
      );

    }


    /*
      Find product
    */

    currentProduct =
      products.find(
        function(item){

          return (
            item.id === requestedId ||
            item.slug === requestedId
          );

        }
      );


    /*
      Fallback to first product
    */

    if(!currentProduct){

      currentProduct =
        products[0];

    }


    if(!currentProduct){

      throw new Error(
        "No product found."
      );

    }


    /*
      Page title
    */

    document.title =
      currentProduct.name +
      " — ONE ERA";


    /*
      Price
    */

    const priceDisplay =
      currentProduct.price &&
      currentProduct.price.display
        ? currentProduct.price.display
        : "TEST PRICE";


    /*
      Ritual
    */

    let ritualHTML = "";


    if(
      currentProduct.ritual &&
      Array.isArray(
        currentProduct.ritual.howToUse
      )
    ){

      ritualHTML =
        "<ul class='ritual-list'>" +

        currentProduct
          .ritual
          .howToUse
          .map(
            function(step){

              return (
                "<li>" +
                step +
                "</li>"
              );

            }
          )
          .join("") +

        "</ul>";

    }


    /*
      Render Product Page
    */

    root.innerHTML = `

      <div class="pd-grid">


        <div class="pd-art">

          <span>
            ONE ERA · PRODUCT IMAGE
          </span>

        </div>


        <div class="pd-copy">


          <div class="test-badge">
            TEST MODE
          </div>


          <div class="eyebrow">

            ${
              currentProduct.collection ||
              currentProduct.category ||
              ""
            }

          </div>


          <h1>

            ${
              currentProduct.name ||
              ""
            }

          </h1>


          <p>

            ${
              currentProduct.subtitle ||
              currentProduct.shortDescription ||
              ""
            }

          </p>


          <div class="price">

            ${priceDisplay}

          </div>


          <!-- =========================
               REAL ADD TO BAG BUTTON
          ========================== -->

          <div class="buy-area">


            <button
              id="addToBagButton"
              class="add-to-bag"
              type="button"
            >

              Add to bag

            </button>


            <div
              id="addSuccess"
              class="add-success"
            >

              ✓ Added to your test bag.

              <br><br>

              <a href="cart.html">
                View your bag →
              </a>

            </div>


          </div>


          <div class="notice">

            <strong>
              TEST MODE
            </strong>

            <br>

            This product is connected to the
            ONE ERA product system for testing.

            <br>

            No real payment,
            customer order,
            or CJ order will be created.

          </div>


          <div class="pd-meta">


            <div>

              <b>
                Category
              </b>

              ${
                currentProduct.category ||
                "—"
              }

            </div>


            <div>

              <b>
                Collection
              </b>

              ${
                currentProduct.collection ||
                "—"
              }

            </div>


            <div>

              <b>
                Material
              </b>

              ${
                currentProduct.specifications &&
                currentProduct.specifications.material
                  ? currentProduct.specifications.material
                  : "—"
              }

            </div>


            <div>

              <b>
                Weight
              </b>

              ${
                currentProduct.specifications &&
                currentProduct.specifications.weight
                  ? currentProduct.specifications.weight
                  : "—"
              }

            </div>


            <div>

              <b>
                Supplier
              </b>

              ${
                currentProduct.supplier &&
                currentProduct.supplier.platform
                  ? currentProduct.supplier.platform
                  : "—"
              }

            </div>


            <div>

              <b>
                Status
              </b>

              ${
                currentProduct.status ||
                "TEST"
              }

            </div>


          </div>


        </div>

      </div>



      <div class="pd-tabs">


        <div class="pd-tab">

          <div class="eyebrow">
            WHAT IT IS
          </div>

          <h3>
            The object
          </h3>

          <p>

            ${
              currentProduct.description ||
              currentProduct.shortDescription ||
              ""
            }

          </p>

        </div>


        <div class="pd-tab">

          <div class="eyebrow">
            ONE ERA
          </div>

          <h3>
            Why it belongs here
          </h3>

          <p>

            ${
              currentProduct.story &&
              currentProduct.story.body
                ? currentProduct.story.body
                : "A ONE ERA object for exploration, ritual and reflection."
            }

          </p>

        </div>


        <div class="pd-tab">

          <div class="eyebrow">
            RITUAL
          </div>

          <h3>
            How to use
          </h3>

          ${
            ritualHTML ||
            "<p>Ritual instructions will be added.</p>"
          }

        </div>


        <div class="pd-tab">

          <div class="eyebrow">
            SUPPLIER
          </div>

          <h3>
            Test Mapping
          </h3>

          <p>

            CJdropshipping SKU:

            ${
              currentProduct.supplier &&
              currentProduct.supplier.sku
                ? currentProduct.supplier.sku
                : "—"
            }

            <br><br>

            Fulfillment:

            ${
              currentProduct.fulfillment &&
              currentProduct.fulfillment.mode
                ? currentProduct.fulfillment.mode
                : "TEST"
            }

          </p>

        </div>


      </div>

    `;


    /*
      Attach button AFTER render
    */

    document
      .getElementById(
        "addToBagButton"
      )
      .addEventListener(
        "click",
        addToBag
      );


    /*
      Initial bag count
    */

    updateBagCount();

  }


  catch(error){

    console.error(error);


    root.innerHTML = `

      <div class="notice">

        <strong>
          PRODUCT SYSTEM ERROR
        </strong>

        <p>

          ${error.message}

        </p>

        <p>

          Check that products.json exists
          in the same GitHub repository
          as product.html.

        </p>

      </div>

    `;

  }

}


loadProduct();


</script>


<script src="script.js"></script>


</body>

</html>
