<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product — ONE ERA</title><link rel="stylesheet" href="styles.css">
<style>
.pd{padding:70px 0}.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px}.pd-art{aspect-ratio:1/1;background:radial-gradient(circle at 50% 35%,rgba(200,143,157,.65),transparent 14%),linear-gradient(145deg,#d7c8bf,#1c2c28)}.pd-copy h1{font-size:clamp(42px,5vw,70px);margin:12px 0}.pd-copy .price{font-size:18px;margin:20px 0}.pd-copy p{line-height:1.8;color:#625b53}.pd-meta{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:30px}.pd-meta div{padding:14px 0;border-bottom:1px solid var(--line);font-size:12px}.pd-meta b{display:block;font-size:8px;letter-spacing:.13em;text-transform:uppercase;opacity:.5;margin-bottom:4px}.pd-tabs{margin-top:80px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.pd-tab{border-top:1px solid var(--line);padding:22px}.pd-tab h3{font-size:27px}.pd-tab p{font-size:13px;line-height:1.8;color:#665f57}.notice{background:#f2eadf;padding:20px;font-size:12px;color:#665f57;margin-top:20px}.disabled{opacity:.5;pointer-events:none}
@media(max-width:750px){.pd-grid,.pd-tabs{grid-template-columns:1fr}}
</style></head>
<body>
<header class="site-header"><div class="container nav"><a class="wordmark" href="index.html">ONE ERA</a><nav class="nav-links"><a href="discover.html">Explore</a><a href="practice.html">Practice</a><a class="active-nav" href="shop.html">Shop</a><a href="learn.html">Learn</a><a href="journal.html">Journal</a><a href="about.html">The Society</a></nav><div class="nav-icons"><span>⌕</span><a href="cart.html">Bag <span data-cart-count>0</span></a></div><span class="mobile-menu">☰</span></div></header>
<main><section class="pd"><div class="container" id="productRoot"><p>Loading…</p></div></section></main>
<footer class="footer"><div class="container"><div class="wordmark">ONE ERA</div><p>THE SPIRITUAL SOCIETY</p></div></footer>
<script>
async function loadProduct(){
 const params=new URLSearchParams(location.search);const slug=params.get('product')||'botanical-incense-open';
 const data=await (await fetch('products.json')).json();const p=data.products.find(x=>x.slug===slug)||data.products[0];
 document.title=p.name+' — ONE ERA';
 const root=document.getElementById('productRoot');
 root.innerHTML='<div class="pd-grid"><div class="pd-art"></div><div class="pd-copy"><div class="eyebrow">'+(p.collection||p.category)+'</div><h1>'+p.name+'</h1><p>'+((p.botanical)?p.botanical+' · ':'')+(p.ritual_state||'A ONE ERA object')+'</p><div class="price">$'+p.price_usd+' · £'+p.price_gbp+' · ฿'+p.price_thb+'</div><a class="btn btn-dark '+(p.status==='planned'||p.status==='concept'?'disabled':'')+'" href="cart.html">Add to bag</a><div class="notice">'+(p.status==='planned'||p.status==='concept'?'This is currently a planned/concept item. Final availability will follow supplier validation.':'Product specifications and availability should be confirmed before launch.')+'</div><div class="pd-meta"><div><b>Category</b>'+p.category+'</div><div><b>Collection</b>'+p.collection+'</div><div><b>State</b>'+(p.ritual_state||'—')+'</div><div><b>Status</b>'+p.status+'</div></div></div></div><div class="pd-tabs"><div class="pd-tab"><div class="eyebrow">What it is</div><h3>The object</h3><p>'+p.notes+'</p></div><div class="pd-tab"><div class="eyebrow">ONE ERA</div><h3>Why it belongs here</h3><p>Every product will eventually receive original ONE ERA editorial content covering the object, its context, relevant beliefs and a practical way to engage with it.</p></div></div>';
}
loadProduct();
</script><script src="script.js"></script>
</body></html>
