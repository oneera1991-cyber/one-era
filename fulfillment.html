<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ONE ERA — Fulfillment</title>


<style>

:root {

  --obsidian: #11100F;

  --bone: #E8DFD2;

  --paper: #F5EFE7;

  --white: #FFFFFF;

  --line: rgba(17,16,15,.12);

  --muted: #70685F;

  --rose: #C88F9D;

  --green: #315B45;

}


* {

  box-sizing: border-box;

}


body {

  margin: 0;

  background: var(--bone);

  color: var(--obsidian);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


header {

  padding: 24px 5vw;

  border-bottom:
    1px solid var(--line);

}


.logo {

  font-family: Georgia, serif;

  font-size: 25px;

  letter-spacing: .12em;

}


main {

  max-width: 900px;

  margin: auto;

  padding:
    70px 24px 100px;

}


.eyebrow {

  font-size: 11px;

  letter-spacing: .2em;

  color: var(--muted);

  text-transform: uppercase;

}


h1 {

  font-family: Georgia, serif;

  font-size:
    clamp(50px, 9vw, 90px);

  font-weight: 400;

  line-height: .95;

  margin:
    18px 0 45px;

}


.card {

  background: var(--paper);

  border:
    1px solid var(--line);

  padding: 30px;

}


h2 {

  font-family: Georgia, serif;

  font-size: 32px;

  font-weight: 400;

  margin-top: 0;

}


p {

  line-height: 1.7;

}


.test {

  margin-top: 25px;

  padding: 20px;

  background:
    rgba(200,143,157,.10);

  border-left:
    3px solid var(--rose);

  line-height: 1.7;

}


button {

  width: 100%;

  padding: 18px;

  margin-top: 18px;

  border: none;

  background: var(--obsidian);

  color: var(--bone);

  font-size: 13px;

  letter-spacing: .12em;

  text-transform: uppercase;

  cursor: pointer;

}


button:active {

  transform: scale(.99);

}


#result,

#fulfillmentResult {

  display: none;

  margin-top: 25px;

  padding: 22px;

  background: var(--white);

  border:
    1px solid var(--line);

  line-height: 1.8;

  overflow-wrap: anywhere;

}


.success {

  color: var(--green);

  font-weight: bold;

  letter-spacing: .04em;

}


.status {

  display: inline-block;

  padding:
    5px 10px;

  background:
    rgba(49,91,69,.10);

  color: var(--green);

  font-size: 12px;

  letter-spacing: .08em;

}


pre {

  margin-top: 15px;

  padding: 18px;

  background: var(--obsidian);

  color: var(--bone);

  overflow-x: auto;

  font-size: 12px;

  line-height: 1.6;

  white-space: pre-wrap;

  word-break: break-word;

}


.divider {

  height: 1px;

  background: var(--line);

  margin:
    30px 0;

}


.small {

  font-size: 13px;

  color: var(--muted);

}


</style>

</head>


<body>


<header>

  <div class="logo">
    ONE ERA
  </div>

</header>


<main>


  <div class="eyebrow">
    ONE ERA · PHASE 4.5
  </div>


  <h1>
    Order<br>
    Fulfillment.
  </h1>


  <section class="card">


    <h2>
      Order → Fulfillment → CJ
    </h2>


    <p>

      This page tests the connection between
      the ONE ERA order system and the
      fulfillment layer.

    </p>


    <div class="test">

      <strong>
        TEST MODE
      </strong>

      <br>

      No real payment is processed.

      <br>

      No real CJ order is created.

      <br>

      No shipment is submitted.

    </div>


    <!-- =========================================
         STEP 1
         CREATE TEST ORDER
         ========================================= -->


    <button
      id="createOrder"
      type="button"
    >

      CREATE TEST ORDER

    </button>


    <div
      id="result"
    >

    </div>


    <!-- =========================================
         STEP 2
         PREPARE FULFILLMENT
         ========================================= -->


    <button
      id="prepareFulfillment"
      type="button"
    >

      PREPARE CJ FULFILLMENT

    </button>


    <div
      id="fulfillmentResult"
    >

    </div>


  </section>


</main>


<!-- =============================================
     PHASE 4.5 FULFILLMENT ENGINE
     ============================================= -->

<script src="orders.js"></script>
<script src="fulfillment.js"></script>


<script>

(function () {


  "use strict";


  console.log(
    "ONE ERA Phase 4.5 interface loaded."
  );


  /* =========================================
     ELEMENTS
     ========================================= */


  const createButton =
    document.getElementById(
      "createOrder"
    );


  const prepareButton =
    document.getElementById(
      "prepareFulfillment"
    );


  const result =
    document.getElementById(
      "result"
    );


  const fulfillmentResult =
    document.getElementById(
      "fulfillmentResult"
    );


  /* =========================================
     CHECK ELEMENTS
     ========================================= */


  if (!createButton) {

    console.error(
      "ONE ERA: createOrder button missing."
    );

    return;

  }


  if (!prepareButton) {

    console.error(
      "ONE ERA: prepareFulfillment button missing."
    );

    return;

  }


  /* =========================================
     CREATE TEST ORDER
     ========================================= */


  createButton.addEventListener(

    "click",

    function () {


      const date =

        new Date()

          .toISOString()

          .slice(0, 10)

          .replace(/-/g, "");


      const random =

        Math.random()

          .toString(36)

          .substring(2, 8)

          .toUpperCase();


      const orderId =

        "OE-" +
        date +
        "-" +
        random;


      const order = {


        order_id:
          orderId,


        created_at:
          new Date().toISOString(),


        market:
          "TH",


        currency:
          "THB",


        customer: {

          name:
            "ONE ERA Test Customer",

          email:
            "test@example.com"

        },


        shipping_address: {

          country:
            "TH",

          city:
            "Bangkok",

          postal_code:
            "10110"

        },


        items: [

          {

            product_id:
              "ONEERA-TEST-001",

            sku:
              "ONEERA-TEST-001",

            quantity:
              1,

            price:
              100

          }

        ],


        subtotal:
          100,


        shipping:
          20,


        taxes:
          0,


        duties:
          0,


        total:
          120,


        payment_status:
          "paid",


        fulfillment_status:
          "pending"


      };


      /* =====================================
         SAVE ORDER
         ===================================== */


      localStorage.setItem(

        "oneera_test_order",

        JSON.stringify(
          order
        )

      );


      /* =====================================
         DISPLAY
         ===================================== */


      result.style.display =
        "block";


      result.innerHTML =


        '<div class="success">' +

        '✓ TEST ORDER CREATED' +

        '</div>' +


        '<div class="divider"></div>' +


        '<strong>Order ID</strong><br>' +

        order.order_id +

        '<br><br>' +


        '<strong>Market</strong><br>' +

        order.market +

        '<br><br>' +


        '<strong>Currency</strong><br>' +

        order.currency +

        '<br><br>' +


        '<strong>Payment</strong><br>' +

        order.payment_status +

        '<br><br>' +


        '<strong>Fulfillment</strong><br>' +

        order.fulfillment_status;


      console.log(
        "ONE ERA TEST ORDER:",
        order
      );


    }

  );


  /* =========================================
     PREPARE CJ FULFILLMENT
     ========================================= */


  prepareButton.addEventListener(

    "click",

    function () {


      fulfillmentResult.style.display =
        "block";


      /* =====================================
         CHECK FULFILLMENT ENGINE
         ===================================== */


      if (
        !window.ONEERA_FULFILLMENT
      ) {


        fulfillmentResult.innerHTML =

          '<div class="error">' +

          '<strong>ERROR</strong>' +

          '<br><br>' +

          'fulfillment.js could not be loaded.' +

          '<br><br>' +

          'Make sure fulfillment.js exists ' +

          'in the same GitHub repository ' +

          'and has been committed.'

          +

          '</div>';


        return;

      }


      try {


        /* ===================================
           GET ORDER
           =================================== */


        const order =

          window.ONEERA_FULFILLMENT
            .getOrder();


        if (!order) {


          fulfillmentResult.innerHTML =

            '<strong>NO ORDER FOUND</strong>' +

            '<br><br>' +

            'Please click ' +

            '<strong>CREATE TEST ORDER</strong>' +

            ' first.';


          return;

        }


        /* ===================================
           CREATE FULFILLMENT
           =================================== */


        const fulfillment =

          window.ONEERA_FULFILLMENT

            .createFulfillment(
              order
            );


        /* ===================================
           CREATE CJ PAYLOAD
           =================================== */


        const cjPayload =

          window.ONEERA_FULFILLMENT

            .createCJPayload(
              fulfillment
            );


        /* ===================================
           DISPLAY RESULT
           =================================== */


        fulfillmentResult.innerHTML =


          '<div class="success">' +

          '✓ FULFILLMENT READY' +

          '</div>' +


          '<div class="divider"></div>' +


          '<strong>ONE ERA Order</strong>' +

          '<br>' +

          fulfillment.order_id +


          '<br><br>' +


          '<strong>Fulfillment ID</strong>' +

          '<br>' +

          fulfillment.fulfillment_id +


          '<br><br>' +


          '<strong>Status</strong>' +

          '<br>' +


          '<span class="status">' +

          fulfillment.status +

          '</span>' +


          '<br><br>' +


          '<strong>CJ Status</strong>' +

          '<br>' +

          fulfillment.cj.status +


          '<br><br>' +


          '<strong>CJ Payload</strong>' +


          '<pre>' +

          JSON.stringify(

            cjPayload,

            null,

            2

          ) +

          '</pre>';


        console.log(

          "ONE ERA FULFILLMENT:",

          fulfillment

        );


        console.log(

          "ONE ERA CJ PAYLOAD:",

          cjPayload

        );


      }


      catch (error) {


        console.error(
          "ONE ERA Phase 4.5 error:",
          error
        );


        fulfillmentResult.innerHTML =


          '<strong>ERROR</strong>' +

          '<br><br>' +

          error.message;


      }


    }

  );


})();

</script>


</body>

</html>
