<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ONE ERA — Order Test</title>

<style>

:root {
  --obsidian: #11100F;
  --bone: #E8DFD2;
  --paper: #F5EFE7;
  --line: rgba(17,16,15,.12);
  --muted: #70685F;
  --rose: #C88F9D;
}

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background: var(--bone);

  color: var(--obsidian);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

header {

  padding: 24px 5vw;

  border-bottom:
    1px solid var(--line);

}

.logo {

  font-family: Georgia, serif;

  font-size: 25px;

  letter-spacing: .12em;

}

main {

  max-width: 900px;

  margin: auto;

  padding:
    80px 24px 100px;

}

.eyebrow {

  font-size: 11px;

  letter-spacing: .2em;

  color: var(--muted);

  text-transform: uppercase;

}

h1 {

  font-family: Georgia, serif;

  font-size:
    clamp(50px, 9vw, 90px);

  font-weight: 400;

  line-height: .95;

  margin:
    18px 0 45px;

}

.card {

  background: var(--paper);

  border:
    1px solid var(--line);

  padding: 30px;

}

h2 {

  font-family: Georgia, serif;

  font-size: 32px;

  font-weight: 400;

  margin-top: 0;

}

button {

  width: 100%;

  padding: 18px;

  margin-top: 25px;

  border: none;

  background: var(--obsidian);

  color: var(--bone);

  font-size: 13px;

  letter-spacing: .12em;

  text-transform: uppercase;

  cursor: pointer;

}

button:active {

  transform: scale(.99);

}

#result {

  display: none;

  margin-top: 25px;

  padding: 20px;

  background: white;

  border:
    1px solid var(--line);

  line-height: 1.8;

}

.success {

  color: #315B45;

  font-weight: bold;

}

.test {

  margin-top: 30px;

  padding: 20px;

  background:
    rgba(200,143,157,.10);

  border-left:
    3px solid var(--rose);

  line-height: 1.6;

}

</style>

</head>


<body>


<header>

<div class="logo">
ONE ERA
</div>

</header>


<main>


<div class="eyebrow">
ONE ERA · PHASE 4.4
</div>


<h1>
Order<br>
Architecture.
</h1>


<section class="card">


<h2>
Order System Test
</h2>


<p>

This is a standalone test of the
ONE ERA order engine.

</p>


<div class="test">

<strong>
TEST MODE
</strong>

<br>

This test does not charge money,
does not contact CJ and does not
create a real customer order.

</div>


<button
  id="createOrder"
  type="button"
>

CREATE TEST ORDER

</button>


<div
  id="result"
>

</div>


</section>


</main>


<script>

/* =====================================================
   ONE ERA
   PHASE 4.4
   STANDALONE ORDER TEST
   ===================================================== */


(function () {


  console.log(
    "ONE ERA TEST: JavaScript loaded"
  );


  /* -----------------------------------------
     Elements
     ----------------------------------------- */

  const button =
    document.getElementById(
      "createOrder"
    );


  const result =
    document.getElementById(
      "result"
    );


  /* -----------------------------------------
     Safety check
     ----------------------------------------- */

  if (!button) {

    console.error(
      "ONE ERA TEST: Button not found"
    );

    return;

  }


  /* -----------------------------------------
     Create Order ID
     ----------------------------------------- */

  function createOrderId() {

    const date =
      new Date()
        .toISOString()
        .slice(0, 10)
        .replace(/-/g, "");


    const random =
      Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();


    return (
      "OE-" +
      date +
      "-" +
      random
    );

  }


  /* -----------------------------------------
     Button
     ----------------------------------------- */

  button.addEventListener(

    "click",

    function () {


      console.log(
        "ONE ERA TEST: Button clicked"
      );


      const orderId =
        createOrderId();


      const order = {

        order_id:
          orderId,

        market:
          "TH",

        currency:
          "THB",

        payment_status:
          "paid",

        fulfillment_status:
          "pending"

      };


      /* ---------------------------------------
         Save test order
         --------------------------------------- */

      try {

        localStorage.setItem(

          "oneera_test_order",

          JSON.stringify(
            order
          )

        );

      }

      catch (error) {

        console.error(
          "Local storage error:",
          error
        );

      }


      /* ---------------------------------------
         Show result
         --------------------------------------- */

      result.style.display =
        "block";


      result.innerHTML =

        '<div class="success">' +

        '✓ TEST ORDER CREATED' +

        '</div>' +

        '<br>' +

        '<strong>Order ID:</strong> ' +

        order.order_id +

        '<br>' +

        '<strong>Market:</strong> ' +

        order.market +

        '<br>' +

        '<strong>Currency:</strong> ' +

        order.currency +

        '<br>' +

        '<strong>Payment:</strong> ' +

        order.payment_status +

        '<br>' +

        '<strong>Fulfillment:</strong> ' +

        order.fulfillment_status;


    }

  );


})();

</script>


</body>

</html>
