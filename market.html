<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Selector — ONE ERA</title><link rel="stylesheet" href="styles.css"><style>
.wrap{max-width:720px;margin:80px auto;padding:0 20px}.panel{background:#f2eadf;padding:35px;margin-top:25px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ccc;padding:15px 0}.select{padding:13px;width:100%;margin-top:12px}
</style></head><body><div class="wrap"><div class="eyebrow">ONE ERA · MARKET</div><h1>Where are you shopping from?</h1><div class="panel"><label class="eyebrow">DELIVERY COUNTRY</label><select class="select" data-country-select></select><div class="row"><span>Market</span><strong data-country-label>—</strong></div><div class="row"><span>Currency</span><strong data-currency-code>—</strong></div><div class="row"><span>Symbol</span><strong data-currency-symbol>—</strong></div></div><p style="font-size:12px;color:#665f57;line-height:1.7">Your selection is stored locally in this browser and can be changed at any time.</p><a href="shop.html">← Back to Shop</a></div><script src="commerce.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{await ONEERA_COMMERCE.loadConfig();const s=document.querySelector("[data-country-select]");s.innerHTML="";ONEERA_COMMERCE.config.supported_countries.forEach(c=>{const o=document.createElement("option");o.value=c.code;o.textContent=c.flag+" "+c.name+" — "+c.currency;s.appendChild(o)});s.value=ONEERA_COMMERCE.getCountry();s.dispatchEvent(new Event("change"));});</script></body></html>
